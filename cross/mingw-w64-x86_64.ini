# Cross file for building rlib with the mingw-w64 toolchain (GCC targeting the
# Windows runtime), e.g. to check the Windows build with a non-MSVC compiler.
#
#   meson setup build-mingw --cross-file cross/mingw-w64-x86_64.ini
#   meson compile -C build-mingw
#
# To run the result under Wine, add `exe_wrapper = 'wine'` below (and ensure the
# mingw runtime DLLs -- libwinpthread-1, libgcc_s_seh-1, libssp-0 -- are on the
# Wine path) and use `meson test`.

[binaries]
c = 'x86_64-w64-mingw32-gcc'
cpp = 'x86_64-w64-mingw32-g++'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
